name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run tsc
    - run: npm run tsc-prod
    - run: npm test
    - run: npm run attw
      env:
        CI: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - run: echo "all matrix jobs passed"
